  <style>
    :root{--bg:#111;--card:#202020;--soft:#171717;--line:rgba(255,255,255,.09);--text:#fafafa;--muted:#a1a1aa;--dim:#5e5e68;--orange:#f97316;--orange2:#fb923c;--red:#ef4444;font:16px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}*{box-sizing:border-box}[hidden]{display:none!important}html{scrollbar-gutter:stable}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,rgba(249,115,22,.12),transparent 30%),radial-gradient(circle at 100% 35%,rgba(255,255,255,.04),transparent 28%),var(--bg);color:var(--text)}button,input,textarea{font:inherit}button{touch-action:manipulation}.wrap{width:min(1440px,100%);margin:auto;padding:36px 40px 20px}.top{margin-bottom:40px}.headline-row{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;color:var(--orange2);font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}.eyebrow:before{content:"";width:28px;height:1px;background:var(--orange)}h1{margin:0;font-size:clamp(30px,4vw,48px);line-height:1.05;letter-spacing:-.045em}.count{margin:12px 0 0;color:#71717a;font-size:14px}.owner{display:inline-flex;align-items:center;margin-left:10px;padding:3px 9px;border:1px solid rgba(249,115,22,.2);border-radius:999px;background:rgba(249,115,22,.1);color:#fdba74;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;gap:16px}.card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:var(--card);box-shadow:0 18px 55px rgba(0,0,0,.22);transition:.25s}.card:hover{transform:translateY(-2px);border-color:rgba(249,115,22,.25)}.card:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(var(--orange2),#c2410c)}.pad{padding:24px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:26px}.brand{display:flex;min-width:0;align-items:cente     .wrap{width:min(1180px,100%);padding:28px 32px 18px}.top{margin-bottom:28px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:4px;align-items:start;column-gap:14px;row-gap:0}.card{width:100%;margin:0;vertical-align:top}.pad{padding:18px}.head{gap:12px;margin-bottom:14px}.icon{width:36px;height:36px;overflow:hidden;border-color:var(--card-border,var(--line));border-radius:12px;background:var(--card-soft,rgba(249,115,22,.1));color:var(--card-accent,var(--orange2));font-size:17px}.icon img{width:100%;height:100%;object-fit:cover}.name{font-size:18px}.idea{min-height:0;margin-bottom:9px}.idea p{margin-top:4px;font-size:14px;line-height:1.45}.row{display:flex;gap:10px;margin-top:8px;padding:9px;border-radius:12px}.row .mini{width:32px;height:32px;border-radius:9px}.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.tag{padding:1px 6px;border:1px solid var(--card-border);border-radius:6px;background:var(--card-soft);color:var(--card-accent);font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}.featured-tag{display:inline-flex;align-items:center;gap:4px;border-color:rgba(249,115,22,.3);background:rgba(249,115,22,.15);color:#fdba74}.color-picker{display:flex;flex-wrap:wrap;gap:8px}.color-choice{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);border-radius:11px;background:rgba(0,0,0,.2);cursor:pointer}.color-choice:has(input:checked){border-color:#fff;transform:scale(1.08)}.color-choice input{position:absolute;width:1px;height:1px;opacity:0}.swatch{width:16px;height:16px;border-radius:50%;background:var(--swatch)}.help{color:#5e5e68;font-size:12px;font-weight:400}.logo-field{display:flex;min-height:80px;align-items:center;gap:12px;padding:12px;border:1px dashed var(--line);border-radius:12px;background:rgba(0,0,0,.2)}.logo-preview{display:grid;width:56px;height:56px;flex:none;place-items:center;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:rgba(25 -3px}.view-btn span{display:none}.compact-row{align-items:flex-start;flex-direction:column}.compact-actions{width:100%;flex-wrap:wrap}.compact-main{width:100%}}
    .favicon img{width:16px;height:16px;border-radius:3px}.link-copy-text{min-width:0;flex:1;overflow:hidden;padding:0;border:0;background:transparent;color:#d4d4d8;font-size:14px;font-weight:600;text-align:left;text-overflow:ellipsis;white-space:nowrap;cursor:copy}.link-copy-text:hover{color:#fff}.link-kind{flex:none;padding:2px 6px;border:1px solid;border-radius:6px;font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}.link-kind.site{border-color:rgba(52,211,153,.25);background:rgba(52,211,153,.1);color:#6ee7b7}.link-kind.figma{border-color:rgba(167,139,250,.25);background:rgba(167,139,250,.1);color:#c4b5fd}.link-kind.prototype{border-color:rgba(34,211,238,.25);background:rgba(34,211,238,.1);color:#67e8f9}.compact-link-bundle{display:flex;min-width:0;align-items:center;gap:8px}.compact-link{min-width:0;flex:1}.compact-link .mini{width:28px;height:28px}.filterbar{display:block}.categories{width:100%}@media(max-width:700px){.link-copy-action{display:none}.compact-password{width:100%}.compact-link-bundle{width:100%}.compact-link{flex:1}.header-actions{flex-wrap:wrap}}

<body>
  <main class="wrap">
    <header class="top"><div class="eyebrow">Product access board</div><div class="headline-row"><div><h1>Recent Projects.</h1><p class="count" id="count">Loading products…</p></div><div class="header-actions"><div id="profile"></div><a class="profile-link" href="https://vitaliydiduh.com/" target="_blank" rel="noreferrer"><span class="avatar portfolio-icon"><img src="https://framerusercontent.com/images/Uwv9M4ULthNabbANJCvPkyWWw70.png" alt=""></span><span>My portfolio</span></a><div class="view-switch" id="view-switch" role="group" aria-label="Project view" hidden><button class="view-btn" type="button" data-view="cards" aria-label="Cards view">▦ <span>Cards</span></button><button class="view-btn" type="button" data-view="compact" aria-label="Compact view">☷ <span>Compact</span></button></div><button class="btn primary" id="add" hidden>＋ Add product</button></div></div></header>
    <div class="filterbar" id="filterbar" hidden><nav class="categories" id="categories" aria-label="Project categories"></nav></div>
    <section class="profile-editor" id="profile-editor" hidden></section>
    <section class="grid" id="grid"><div class="loading"></div><div class="loading"></div><div class="loading"></div></section>
    <footer class="footer"><span>Product Badge Board</span><span>✓ Synced across devices</span></footer>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script>
    // This downloadable file reads and edits the same cloud data as the published Notion embed.
    const API_BASE='https://product-badge-board.vilento-belet.chatgpt.site';
    const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const COLORS={orange:['#f97316','rgba(249,115,22,.12)','rgba(249,115,22,.28)'],blue:['#3b82f6','rgba(59,130,246,.12)','rgba(59,130,246,.28)'],emerald:['#10b981','rgba(16,185,129,.12)','rgba(16,185,129,.28)'],violet:['#8b5cf6','rgba(139,92,246,.12)','rgba(139,92,246,.28)'],rose:['#f43f5e','rgba(244,63,94,.12)','rgba(244,63,94,.28)'],cyan:['#06b6d4','rgba(6,182,212,.12)','rgba(6,182,212,.28)']};
    let products=[],profile={linkedinUrl:'',avatarUrl:''},editing=null,adding=false,profileEditing=false,activeCategory=sessionStorage.getItem('product-badge-category')||'All',viewMode=sessionStorage.getItem('product-badge-view-mode')||'cards',visible=new Set(),copied=new Map(),token='',dragId=null,overId=null,scrollRestored=false,scrollFrame=0;
    if(!['cards','compact'].includes(viewMode))viewMode='cards';
    const fragment=new URLSearchParams(location.hash.slice(1));
    if(fragment.get('admin')){token=fragment.get('admin');sessionStorage.setItem('product-badge-admin',token);history.replaceState(null,'',location.pathname+location.search)}else token=sessionStorage.getItem('product-badge-admin')||'';
    const headers=(json=false)=>({...json?{'Content-Type':'application/json'}:{},...(token?{'x-admin-token':token}:{})});
    function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
    async function copy(value,id,kind){try{await navigator.clipboard.writeText(value);copied.set(id,kind);toast(kind==='link'?'Link copied':'Password copied');render();setTimeout(()=>{if(copied.get(id)===kind){copied.delete(id);render()}},1400)}catch{toast('Copy failed')}}
    function normalizedLink(value){const text=String(value||'').trim();return /^https?:\/\//i.test(text)?text:'https://'+text}
    function linkDetails(value){try{const url=new URL(normalizedLink(value)),host=url.host.replace(/^www\./,'');let kind='Site';if(host==='figma.com'||host.endsWith('.figma.com'))kind=url.pathname.toLowerCase().startsWith('/proto/')?'Prototype':'Figma';else if(host.endsWith('.figma.site')||host.endsWith('.framer.website')||host.endsWith('.webflow.io')||host.endsWith('.vercel.app')||host.endsWith('.netlify.app')||host.endsWith('.github.io'))kind='Prototype';return{full:url.href,display:host+(url.pathname==='/'?'':url.pathname)+url.search+url.hash,host,kind,favicon:'https://www.google.com/s2/favicons?domain='+encodeURIComponent(host)+'&sz=64'}}catch{return{full:value,display:value,host:value,kind:'Site',favicon:''}}}
    function form(p={industry:'',name:'',idea:'',link:'',password:'',color:'orange',logoUrl:'',featured:false},id='new'){
      const color=p.color||'orange';const choices=Object.entries(COLORS).map(([key,value])=>`<label class="color-choice" style="--swatch:${value[0]}" title="${key}"><input type="radio" name="color" value="${key}" ${color===key?'checked':''}><span class="swatch"></span></label>`).join('');
      const logo=p.logoUrl||'';return `<article class="card form-card"><div class="pad"><form class="form" data-form="${id}"><div class="cols"><label>Industry tags<input name="industry" value="${esc(p.industry)}" required placeholder="AI, B2B, Branding"><span class="help">Separate multiple tags with commas.</span></label><label>Product name<input name="name" value="${esc(p.name)}" required placeholder="Northstar"></label></div><label>Product idea<textarea name="idea" required placeholder="A short description of what this product does">${esc(p.idea)}</textarea></label><div class="cols"><label>Link<input name="link" type="url" value="${esc(p.link)}" required placeholder="https://example.com"></label><label>Password<input name="password" value="${esc(p.password)}" placeholder="Access password"></label></div><div class="cols"><label>Card color<span class="color-picker">${choices}</span></label><div><div style="margin-bottom:7px;color:#d4d4d8;font-size:14px;font-weight:600">Logo image</div><div class="logo-field"><span class="logo-preview" data-logo-preview>${logo?`<img src="${esc(logo)}" alt="Logo preview">`:'▱'}</span><div><div class="upload-actions"><label class="btn upload-btn">▣ Choose image<input type="file" accept="image/png,image/jpeg,image/webp,image/gif" data-logo-upload hidden></label><button class="btn danger" type="button" data-remove-logo ${logo?'':'hidden'}>Remove</button></div><span class="help">PNG, JPG, WebP, or GIF · max 3 MB</span></div><input type="hidden" name="logoUrl" value="${esc(logo)}"></div></div></div><label class="featured-toggle"><span><span style="color:#e4e4e7">✦ Featured project</span><span class="help" style="display:block">Keep this card above regular projects.</span></span><input type="checkbox" name="featured" value="true" ${p.featured?'checked':''}></label><div class="form-actions"><button class="btn primary" type="submit">✓ ${id==='new'?'Add product':'Save changes'}</button><button class="btn" type="button" data-cancel>Cancel</button></div></form></div></article>`
    }
    function renderProfile(){
      const avatar=profile.avatarUrl?`<img src="${esc(profile.avatarUrl)}" alt="Owner avatar">`:'♙';
      const link=profile.linkedinUrl?`<a class="profile-link" href="${esc(profile.linkedinUrl)}" target="_blank" rel="noreferrer"><span class="avatar">${avatar}</span><span>Vitaliy Diduh</span><span class="linkedin-mark">in</span></a>`:`<span class="profile-link"><span class="avatar">♙</span><span>Vitaliy Diduh</span><span class="linkedin-mark">in</span></span>`;
      $('#profile').innerHTML=profile.linkedinUrl||token?`<div class="profile-wrap">${link}${token?'<button class="btn iconbtn" id="edit-profile" aria-label="Edit owner profile">✎</button>':''}</div>`:'';
      const editor=$('#profile-editor');editor.hidden=!profileEditing;
      if(profileEditing){const avatarUrl=profile.avatarUrl||'';editor.innerHTML=`<article class="card"><div class="pad"><form class="form" id="profile-form"><div><div class="label" style="color:var(--orange2)">Owner profile</div><h2 class="name">Edit profile</h2></div><label>LinkedIn URL<input name="linkedinUrl" type="url" value="${esc(profile.linkedinUrl)}" placeholder="https://www.linkedin.com/in/your-name"></label><div><div style="margin-bottom:7px;color:#d4d4d8;font-size:14px;font-weight:600">Profile photo</div><div class="logo-field"><span class="logo-preview avatar-preview" data-avatar-preview>${avatarUrl?`<img src="${esc(avatarUrl)}" alt="Avatar preview">`:'♙'}</span><div><div class="upload-actions"><label class="btn upload-btn">▣ Choose photo<input type="file" accept="image/png,image/jpeg,image/webp,image/gif" data-avatar-upload hidden></label><button class="btn danger" type="button" data-remove-avatar ${avatarUrl?'':'hidden'}>Remove</button></div><span class="help">Square image recommended · max 3 MB</span></div><input type="hidden" name="avatarUrl" value="${esc(avatarUrl)}"></div></div><div class="form-actions"><button class="btn primary" type="submit">✓ Save profile</button><button class="btn" type="button" id="cancel-profile">Cancel</button></div></form></div></article>`}
      $('#edit-profile')?.addEventListener('click',()=>{profileEditing=true;renderProfile()});
      $('#cancel-profile')?.addEventListener('click',()=>{profileEditing=false;renderProfile()});
    }
    function card(p){
      const show=visible.has(p.id),color=COLORS[p.color]||COLORS.orange,tags=String(p.industry||'').split(',').map(x=>x.trim()).filter(Boolean),copiedKind=copied.get(p.id);
      const link=linkDetails(p.link),style=`--card-accent:${color[0]};--card-soft:${color[1]};--card-border:${color[2]}`,logo=`<span class="icon">${p.logoUrl?`<img src="${esc(p.logoUrl)}" alt="">`:'▱'}</span>`,tagHtml=tags.map(tag=>`<span class="tag">${esc(tag)}</span>`).join(''),featured=p.featured?'<span class="tag featured-tag">✦ Featured</span>':'',tools=token?`<div class="card-tools"><button class="btn iconbtn drag-handle" draggable="true" data-drag="${p.id}" aria-label="Move ${esc(p.name)}">⋮⋮</button><button class="btn iconbtn" data-edit="${p.id}" aria-label="Edit ${esc(p.name)}">✎</button><button class="btn iconbtn danger" data-delete="${p.id}" aria-label="Delete ${esc(p.name)}">⌫</button></div>`:'',copyLink=copiedKind==='link'?'Copied ✓':'▣ Copy',copyPassword=copiedKind==='password'?'Copied ✓':'▣ Copy',kindClass=link.kind.toLowerCase(),favicon=`<span class="mini favicon"><img src="${esc(link.favicon)}" alt="" onerror="this.parentNode.textContent='↗'"></span>`,linkText=`<button class="link-copy-text" data-copy-link="${p.id}" title="${esc(link.full)} — click to copy">${esc(link.display)}</button>`,kind=`<span class="link-kind ${kindClass}">${esc(link.kind)}</span>`,open=`<a class="btn open-btn" href="${esc(link.full)}" target="_blank" rel="noreferrer" data-open="${p.id}" title="${p.password?'Copies the password, then opens ': 'Open '}${esc(link.full)}">↗ Open</a>`,password=p.password?`<div class="compact-group compact-password"><span class="pass">${show?esc(p.password):'••••••••'}</span><button class="btn iconbtn" data-show="${p.id}" aria-label="${show?'Hide':'Show'} password">${show?'◉':'◎'}</button><button class="btn compact-copy" data-copy-password="${p.id}">${copyPassword}</button></div>`:'';
      if(viewMode==='compact')return `<article class="card" data-product-id="${p.id}" style="${style}"><div class="compact-pad"><div class="compact-row"><div class="compact-main">${logo}<div class="grow"><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><h2 class="name">${esc(p.name)}</h2>${featured}</div><div class="compact-idea">${esc(p.idea)}</div><div class="tags">${tagHtml}</div></div></div><div class="compact-actions">${password}<div class="compact-link-bundle"><div class="compact-group compact-link">${favicon}${linkText}${kind}<button class="btn compact-copy link-copy-action" data-copy-link="${p.id}">${copyLink}</button></div>${open}</div>${tools}</div></div></div></article>`;
      return `<article class="card" data-product-id="${p.id}" style="${style}"><div class="pad"><div class="head"><div class="brand">${logo}<div style="min-width:0"><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><h2 class="name">${esc(p.name)}</h2>${featured}</div></div></div>${tools}</div><div class="idea"><div class="label">Product idea</div><p>${esc(p.idea)}</p><div class="tags">${tagHtml}</div></div>${p.password?`<div class="row"><span class="mini">⌁</span><div class="grow"><div class="k">Password</div><div class="v pass">${show?esc(p.password):'••••••••'}</div></div><button class="btn iconbtn" data-show="${p.id}" aria-label="${show?'Hide':'Show'} password">${show?'◉':'◎'}</button><button class="btn" data-copy-password="${p.id}">${copyPassword}</button></div>`:''}<div class="row link-row">${favicon}${linkText}${kind}<button class="btn link-copy-action" data-copy-link="${p.id}">${copyLink}</button>${open}</div></div></article>`
    }
    function layoutGrid(){requestAnimationFrame(()=>{$('#grid').querySelectorAll('.card,.loading,.empty').forEach(el=>{el.style.gridRowEnd='auto';if(viewMode==='compact')return;const span=Math.max(1,Math.ceil((el.getBoundingClientRect().height+14)/4));el.style.gridRowEnd=`span ${span}`})})}
    function render(){
      $('#add').hidden=!token;renderProfile();$('#grid').classList.toggle('form-open',adding);$('#grid').classList.toggle('compact',viewMode==='compact');$('#count').innerHTML=`${products.length} ${products.length===1?'product':'products'}${token?' <span class="owner">Owner mode</span>':''}`;
      const seen=new Set(),categories=['All',...products.flatMap(p=>String(p.industry||'').split(',').map(x=>x.trim()).filter(Boolean)).filter(tag=>{const key=tag.toLowerCase();if(seen.has(key))return false;seen.add(key);return true})];
      if(!categories.some(category=>category.toLowerCase()===activeCategory.toLowerCase()))activeCategory='All';
      const categoryNav=$('#categories');$('#filterbar').hidden=false;$('#view-switch').hidden=false;categoryNav.hidden=categories.length<2;categoryNav.innerHTML=categories.map(category=>`<button type="button" class="category ${category.toLowerCase()===activeCategory.toLowerCase()?'active':''}" data-category="${esc(category)}" aria-pressed="${category.toLowerCase()===activeCategory.toLowerCase()}">${esc(category)}</button>`).join('');document.querySelectorAll('[data-view]').forEach(button=>{const active=button.dataset.view===viewMode;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))});sessionStorage.setItem('product-badge-category',activeCategory);sessionStorage.setItem('product-badge-view-mode',viewMode);
      const filtered=activeCategory==='All'?products:products.filter(p=>String(p.industry||'').split(',').some(tag=>tag.trim().toLowerCase()===activeCategory.toLowerCase()));
      const cards=filtered.map(p=>editing===p.id?form(p,p.id):card(p)).join('');const empty=products.length?`<div class="empty"><div><strong>No ${esc(activeCategory)} projects yet</strong><br><button class="btn" type="button" data-category="All">Show all projects</button></div></div>`:'<div class="empty">No products yet</div>';$('#grid').innerHTML=(adding?form():"")+cards||(adding?'':empty);layoutGrid();$('#grid').querySelectorAll('img').forEach(img=>img.addEventListener('load',layoutGrid,{once:true}));
    }
    async function load(){try{const r=await fetch(API_BASE+'/api/products');if(!r.ok)throw Error();products=(await r.json()).products;render();if(!scrollRestored){const saved=Number(sessionStorage.getItem('product-badge-scroll')||0);requestAnimationFrame(()=>requestAnimationFrame(()=>{scrollTo(0,saved);scrollRestored=true}))}}catch{$('#grid').innerHTML='<div class="empty">Product data is temporarily unavailable.</div>';$('#count').textContent='Could not load products'}}
    async function loadProfile(){try{const r=await fetch(API_BASE+'/api/profile');if(!r.ok)throw Error();profile=(await r.json()).profile||profile;renderProfile()}catch{renderProfile()}}
    function clearDrag(){$('#grid').querySelectorAll('.dragging,.drag-over').forEach(el=>el.classList.remove('dragging','drag-over'));dragId=null;overId=null}
    function markTarget(card){if(!card)return;const id=Number(card.dataset.productId);if(id===dragId)return;$('#grid').querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));card.classList.add('drag-over');overId=id}
    async function moveProduct(sourceId,targetId){if(!sourceId||!targetId||sourceId===targetId)return;const from=products.findIndex(p=>p.id===sourceId),to=products.findIndex(p=>p.id===targetId);if(from<0||to<0)return;const previous=[...products],next=[...products],moved=next.splice(from,1)[0];next.splice(to,0,moved);const ordered=next.sort((a,b)=>Number(Boolean(b.featured))-Number(Boolean(a.featured)));products=ordered;render();try{const r=await fetch(API_BASE+'/api/products/reorder',{method:'POST',headers:headers(true),body:JSON.stringify({productIds:ordered.map(p=>p.id)})});if(!r.ok)throw Error();toast('Order saved')}catch{products=previous;render();toast('Could not save order');load()}}
    $('#add').onclick=()=>{adding=true;editing=null;render()};
    $('#filterbar').addEventListener('click',e=>{const button=e.target.closest('button');if(button?.dataset.category){activeCategory=button.dataset.category;editing=null;render()}});
    $('#view-switch').addEventListener('click',e=>{const button=e.target.closest('button');if(button?.dataset.view){viewMode=button.dataset.view;render()}});
    $('#profile-editor').addEventListener('click',e=>{const b=e.target.closest('[data-remove-avatar]');if(!b)return;const f=b.closest('form');f.elements.avatarUrl.value='';f.querySelector('[data-avatar-preview]').textContent='♙';b.hidden=true});
    $('#profile-editor').addEventListener('change',async e=>{const input=e.target.closest('[data-avatar-upload]');if(!input)return;const file=input.files?.[0];input.value='';if(!file)return;if(!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type)){toast('Use a PNG, JPG, WebP, or GIF image');return}if(file.size>3*1024*1024){toast('Avatar must be smaller than 3 MB');return}const form=input.closest('form'),label=input.closest('label'),old=label.firstChild.textContent;label.firstChild.textContent='Uploading…';try{const data=new FormData();data.set('logo',file);const r=await fetch(API_BASE+'/api/logos',{method:'POST',headers:headers(),body:data}),payload=await r.json();if(!r.ok)throw Error(payload.error||'Upload failed');form.elements.avatarUrl.value=payload.logoUrl;form.querySelector('[data-avatar-preview]').innerHTML=`<img src="${esc(payload.logoUrl)}" alt="Avatar preview">`;form.querySelector('[data-remove-avatar]').hidden=false;toast('Avatar uploaded')}catch(error){toast(error.message||'Upload failed')}finally{label.firstChild.textContent=old}});
    $('#profile-editor').addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));if(data.linkedinUrl&&!/^https?:\/\//i.test(data.linkedinUrl))data.linkedinUrl='https://'+data.linkedinUrl;const r=await fetch(API_BASE+'/api/profile',{method:'PUT',headers:headers(true),body:JSON.stringify(data)}),payload=await r.json().catch(()=>({}));if(r.ok){profile=payload.profile;profileEditing=false;renderProfile();toast('Owner profile updated')}else toast(payload.error||'Could not save profile')});
    $('#grid').addEventListener('click',async e=>{const open=e.target.closest('[data-open]');if(open){const p=products.find(x=>x.id===Number(open.dataset.open));if(p?.password){e.preventDefault();const next=window.open('','_blank');if(next)next.opener=null;try{await navigator.clipboard.writeText(p.password);copied.set(p.id,'password');toast('Password copied — paste it on the sign-in page');render();setTimeout(()=>{if(copied.get(p.id)==='password'){copied.delete(p.id);render()}},1400)}catch{toast('Could not copy password')}finally{if(next)next.location.replace(normalizedLink(p.link));else window.open(normalizedLink(p.link),'_blank','noopener,noreferrer')}}return}const b=e.target.closest('button');if(!b)return;if(b.dataset.category){activeCategory=b.dataset.category;render();return}if(b.dataset.removeLogo!==undefined){const f=b.closest('form');f.elements.logoUrl.value='';f.querySelector('[data-logo-preview]').textContent='▱';b.hidden=true;return}const id=Number(b.dataset.edit||b.dataset.show||b.dataset.copyLink||b.dataset.copyPassword||b.dataset.delete);const p=products.find(x=>x.id===id);if(b.dataset.cancel!==undefined){adding=false;editing=null;render()}else if(b.dataset.edit){editing=id;adding=false;render()}else if(b.dataset.show){visible.has(id)?visible.delete(id):visible.add(id);render()}else if(b.dataset.copyLink){copy(p.link,id,'link')}else if(b.dataset.copyPassword){copy(p.password,id,'password')}else if(b.dataset.delete&&confirm(`Delete ${p.name}?`)){const r=await fetch(API_BASE+'/api/products/'+id,{method:'DELETE',headers:headers()});if(r.ok){toast('Product deleted');load()}else toast('Delete failed')}});
    $('#grid').addEventListener('change',async e=>{const input=e.target.closest('[data-logo-upload]');if(!input)return;const file=input.files?.[0];input.value='';if(!file)return;if(!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type)){toast('Use a PNG, JPG, WebP, or GIF image');return}if(file.size>3*1024*1024){toast('Logo must be smaller than 3 MB');return}const form=input.closest('form'),label=input.closest('label'),old=label.firstChild.textContent;label.firstChild.textContent='Uploading…';try{const data=new FormData();data.set('logo',file);const r=await fetch(API_BASE+'/api/logos',{method:'POST',headers:headers(),body:data}),payload=await r.json();if(!r.ok)throw Error(payload.error||'Upload failed');form.elements.logoUrl.value=payload.logoUrl;form.querySelector('[data-logo-preview]').innerHTML=`<img src="${esc(payload.logoUrl)}" alt="Logo preview">`;form.querySelector('[data-remove-logo]').hidden=false;toast('Logo uploaded')}catch(error){toast(error.message||'Upload failed')}finally{label.firstChild.textContent=old}});
    $('#grid').addEventListener('submit',async e=>{e.preventDefault();const f=e.target,id=f.dataset.form;const data=Object.fromEntries(new FormData(f));if(!/^https?:\/\//i.test(data.link))data.link='https://'+data.link;const url=id==='new'?API_BASE+'/api/products':API_BASE+'/api/products/'+id;const r=await fetch(url,{method:id==='new'?'POST':'PATCH',headers:headers(true),body:JSON.stringify(data)});if(r.ok){adding=false;editing=null;toast(id==='new'?'Product added':'Product updated');load()}else{const x=await r.json().catch(()=>({}));toast(x.error||'Save failed')}});
    $('#grid').addEventListener('dragstart',e=>{const handle=e.target.closest('[data-drag]');if(!handle)return;dragId=Number(handle.dataset.drag);handle.closest('.card').classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(dragId))});
    $('#grid').addEventListener('dragover',e=>{if(!dragId)return;e.preventDefault();e.dataTransfer.dropEffect='move';markTarget(e.target.closest('[data-product-id]'))});
    $('#grid').addEventListener('drop',e=>{if(!dragId)return;e.preventDefault();const source=dragId,target=Number(e.target.closest('[data-product-id]')?.dataset.productId||overId);clearDrag();moveProduct(source,target)});
    $('#grid').addEventListener('dragend',clearDrag);
    $('#grid').addEventListener('pointerdown',e=>{const handle=e.target.closest('[data-drag]');if(!handle||e.pointerType==='mouse')return;e.preventDefault();dragId=Number(handle.dataset.drag);handle.setPointerCapture(e.pointerId);handle.closest('.card').classList.add('dragging')});
    $('#grid').addEventListener('pointermove',e=>{if(!dragId||e.pointerType==='mouse')return;markTarget(document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-product-id]'))});
    $('#grid').addEventListener('pointerup',e=>{if(!dragId||e.pointerType==='mouse')return;const source=dragId,target=overId;clearDrag();moveProduct(source,target)});
    addEventListener('resize',layoutGrid);addEventListener('scroll',()=>{if(!scrollRestored)return;cancelAnimationFrame(scrollFrame);scrollFrame=requestAnimationFrame(()=>sessionStorage.setItem('product-badge-scroll',String(scrollY)))},{passive:true});
    if(token)fetch(API_BASE+'/api/admin/check',{headers:headers()}).then(r=>{if(!r.ok){token='';sessionStorage.removeItem('product-badge-admin');toast('Admin link is invalid');render()}});
    loadProfile();load();
  </script>
</body>
</html>
